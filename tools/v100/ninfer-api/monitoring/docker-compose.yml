# NInfer live dashboard: Prometheus scrapes ninfer-serve's /metrics, Grafana renders it.
#
#   cd ~/v100/ninfer-api/monitoring && docker compose up -d     # Prometheus 127.0.0.1:9090, Grafana 0.0.0.0:3000
#   docker compose down
#
# Config (scrape targets, datasource, dashboards) is mounted from this repository, so the tree is
# the authority; the runtime state (Prometheus TSDB, Grafana database) stays in the deployment
# directory and never lands in the tree. Both are overridable with NINFER_REPO_DIR / NINFER_API_DIR.
# Both containers share the host network, so Prometheus reaches the server on loopback and Grafana
# binds the host's 3000 directly.
# The image renderer is optional: without it Grafana serves every panel except `GET /render/...`.
services:
  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: ninfer-renderer
    network_mode: host
    restart: unless-stopped
    environment:
      AUTH_TOKEN: ninfer-renderer-token
  prometheus:
    image: prom/prometheus:latest
    container_name: ninfer-prometheus
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
    volumes:
      - ${NINFER_REPO_DIR:-/home/luyzh/v100/NInfer-V100-Duo}/tools/v100/ninfer-api/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${NINFER_API_DIR:-/home/luyzh/v100/ninfer-api}/monitoring/prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:latest
    container_name: ninfer-grafana
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ninfer
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ninfer.json
      # `GET /render/d/<uid>/...` turns the dashboard into a PNG; the renderer runs beside Grafana.
      GF_RENDERING_SERVER_URL: http://127.0.0.1:8081/render
      GF_RENDERING_CALLBACK_URL: http://127.0.0.1:3000/
      # Grafana refuses its default token once remote rendering is on, so the pair below is this
      # deployment's own secret.
      GF_RENDERING_RENDERER_TOKEN: ninfer-renderer-token
    volumes:
      - ${NINFER_API_DIR:-/home/luyzh/v100/ninfer-api}/monitoring/grafana-data:/var/lib/grafana
      - ${NINFER_REPO_DIR:-/home/luyzh/v100/NInfer-V100-Duo}/tools/v100/ninfer-api/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${NINFER_REPO_DIR:-/home/luyzh/v100/NInfer-V100-Duo}/tools/v100/ninfer-api/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
